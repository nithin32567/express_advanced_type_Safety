<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #172033;
      padding: 24px;
    }

    .auth-box {
      width: min(100%, 420px);
      background: #ffffff;
      border: 1px solid #dce4f0;
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 18px 45px rgba(21, 35, 62, 0.12);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    p {
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: #ffffff;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      text-decoration: none;
    }

    .google-btn:hover {
      background: #f8fafc;
    }

    .switch-link {
      margin-top: 20px;
      text-align: center;
      color: #475569;
    }

    a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    .message {
      min-height: 22px;
      margin-top: 16px;
      text-align: center;
      font-weight: 700;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <main class="auth-box">
    <h1>Create Account</h1>
    <p>Sign up with your details to continue.</p>

    <form id="signupForm">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required minlength="3" maxlength="50">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required minlength="4" maxlength="50">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password" required minlength="8" pattern="[A-Za-z].*" title="Password must be at least 8 characters and start with a letter">

      <label for="age">Age</label>
      <input type="number" id="age" name="age" placeholder="Enter your age" required min="1" max="120">

      <label for="phoneNumber">Phone Number</label>
      <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Enter your phone number" required pattern="[0-9]{10}" title="Phone number must be exactly 10 digits">

      <button type="submit">Sign Up</button>
    </form>

    <a href="/api/auth/google" class="google-btn">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05" />
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
      </svg>
      Sign up with Google
    </a>

    <div class="message" id="message"></div>

    <p class="switch-link">Already have an account? <a href="/signin">Sign in</a></p>
  </main>

  <script>
    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());
      payload.age = Number(payload.age);

      try {
        const response = await fetch("/api/auth/signup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        message.textContent = data.message;
        message.className = response.ok ? "message success" : "message error";

        if (response.ok && data.token) {
          localStorage.setItem("authToken", data.token);
          window.location.href = "/protected-page";
        }
      } catch (error) {
        message.textContent = "Something went wrong. Please try again.";
        message.className = "message error";
      }
    });
  </script>
</body>
</html>
